  /tags:
    get:
      summary: List tags (for pickers and autocomplete)
      operationId: listTags
      tags:
      - Pickers
      description: |
        Who: any logged-in teacher.
        Returns global tags and the caller's own personal tags.
        With `q`, returns only tags whose name contains it (case-insensitive).
      parameters:
      - $ref: '#/components/parameters/TagQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPage'
              example:
                items:
                - id: t2Cd4
                  name: kvadratické rovnice
                  scope: global
                - id: t1Ab3
                  name: lineární rovnice
                  scope: global
                - id: t8Mn1
                  name: opakování 2.A
                  scope: personal
                meta:
                  page: 1
                  limit: 20
                  total: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /chapters:
    get:
      summary: List chapters (flat, build the tree with parentId)
      operationId: listChapters
      tags:
      - Pickers
      description: |
        Who: any logged-in teacher.
        Returns all global chapters and the caller's own personal chapters as a flat list.
        The frontend builds the tree from `parentId` (null = top level).
        A personal chapter may have a global parent.
        Sorted by name within each parent.
        Not paginated: the tree is only usable when complete.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterList'
              example:
                items:
                - id: c2Xy5
                  name: Planimetrie
                  scope: global
                  parentId: null
                - id: c9Kd1
                  name: Rovnice
                  scope: global
                  parentId: null
                - id: c4Lm7
                  name: Lineární rovnice
                  scope: global
                  parentId: c9Kd1
                - id: c6Pr2
                  name: Rovnice – opakování 2.A
                  scope: personal
                  parentId: c9Kd1
        '401':
          $ref: '#/components/responses/Unauthorized'
