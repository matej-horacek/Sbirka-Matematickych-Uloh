        Replaces the copy's content (name, assignment, result, language, difficulty) with the original's
        current version. On a set, the children are replaced with fresh copies of the original's children.
        Tags, chapters and the source stay as they are. Your own edits to the copy are overwritten,
        so the copy's lockVersion is required. Look at the original first via `originalId`.
        On a published copy of a non-trusted author → 202 (review), like PATCH.
