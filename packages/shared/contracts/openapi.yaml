  /problems/{id}/children:
    post:
      summary: Add a child to a set
      operationId: addSetChild
      tags:
      - Sets
      description: |
        Who: the set's author. `id` is the set (or a standalone problem that becomes a set with its first child).
        - `problemId`: moves your own PRIVATE standalone problem into the set (no copy).
        - `copyFromId`: copies any problem you can see into the set (usual copy rules).
        Position with `afterId`: missing = at the end, null = first, a child id = after it.
        The set must not be a child itself and must have no result. The added child takes the set's status;
        in a published set, a child without a licence takes the set's licence.
        Returns the whole set, so the editor gets the new order and lockVersion in one response.
        Codes: 400 VALIDATION_FAILED (both or neither ids, unknown afterId, problem not found);
        403 FORBIDDEN; 404 NOT_FOUND (the set); 409 LOCK_MISMATCH, SET_PARENT_HAS_RESULT,
        IS_SET_CHILD, CANNOT_ADD_TO_SET, LICENSE_REQUIRED.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChildRequest'
            examples:
              moveToEnd:
                summary: Move your own problem in, at the end
                value:
                  lockVersion: 1
                  problemId: a1B2c
              copyAfter:
                summary: Copy a foreign problem in, right after child a1B2c
                value:
                  lockVersion: 2
                  copyFromId: VqXmZ
                  afterId: a1B2c
              first:
                summary: Move in as the first child
                value:
                  lockVersion: 3
                  problemId: d4E5f
                  afterId: null
      responses:
