                  name: lineární rovnice
                  scope: global
                chapters:
                - id: c9Kd1
                  name: Rovnice
                  scope: global
                childCount: 0
                createdAt: '2026-10-25T14:02:00Z'
                updatedAt: '2026-10-25T14:02:00Z'
                source:
                  type: OWN
                  license: null
