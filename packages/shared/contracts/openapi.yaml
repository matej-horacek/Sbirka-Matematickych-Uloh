openapi: 3.0.3
info:
  title: Math app endpoints
  description: |
    Documentation of endpoints for the math problem library
    (Komunitní sbírka úloh z matematiky).

    ## Changelog
    - 2.0.0 (2026-10-29): block model. Problems are created one at a time (`children` removed
      from create and patch); sets are built with POST/PATCH/DELETE /problems/{id}/children
      (move your own problem in, or copy a foreign one; position with `afterId`). A set child is
      edited directly with its own lockVersion. Batch read (`ids`) and `updateAvailable` filter
      on the list; copy updates with take-over-update and dismiss-update. New codes
      CANNOT_ADD_TO_SET and NO_UPDATE_AVAILABLE; SET_CHILD_EDIT_VIA_PARENT renamed to IS_SET_CHILD;
      412 for a failed If-Match.
      Revised 2026-10-31 (before any implementation): copying your own problem keeps source OWN;
      copy holders see `updateAvailable` (no stored notifications); `required` fixed on ProblemCreate
      and ProblemListItem; 400 declared on take-over-update and publish; examples corrected; no YAML anchors.
    - 1.0.1 (2026-10-25): documentation only. operationId on every endpoint, grouping
      sections (Problems, Problem actions, Pickers), realistic request and response examples.
    - 1.0.0 (2026-10-25): frozen contract for the problem part. Problems CRUD with whole-set
      editing (`children`), copy, publish, dissolve; read-only pickers for tags, chapters
      and licences; RFC 9457 errors with `code` values; bearer (JWT) auth on all endpoints.
  version: 2.0.0
servers:
- url: https://main.server.com/api/v1
  description: Not implemented yet
security:
- bearerAuth: []
tags:
- name: Problems
  description: Create, read, update and delete problems and whole sets.
- name: Sets
  description: 'Build a set from blocks: add (move or copy), reorder and take out children.'
- name: Problem actions
  description: Copy, publish, dissolve and copy updates.
- name: Pickers
  description: Read-only lists for the editor (tags, chapters, licences).
paths:
  /problems:
    get:
      summary: List problems
      operationId: listProblems
      tags:
      - Problems
      description: |
        Who: any logged-in teacher.
        scope=mine returns the caller's own problems (dashboard),
        scope=public returns published problems (public browser).
        Set children are not listed on their own; only standalone problems
        and set parents appear (see childCount).
        Several tagId / chapterId values match problems having any of them.
        Codes: 400 VALIDATION_FAILED (e.g. updateAvailable with scope=public).
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/TagIdFilter'
      - $ref: '#/components/parameters/ChapterIdFilter'
      - $ref: '#/components/parameters/LanguageFilter'
      - $ref: '#/components/parameters/IdsFilter'
      - $ref: '#/components/parameters/UpdateAvailableFilter'
      responses:
        '200':
          description: Problems received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
              example:
                items:
                - id: k3Xa9
                  name: Řešte rovnice
                  assignment: 'Vyřešte rovnice v oboru reálných čísel:'
                  result: null
                  language: cs
                  difficulty: 3
                  author:
                    id: u7Hn2
                    displayName: Jan Novák
                  tags:
                  - id: t1Ab3
                    name: lineární rovnice
                    scope: global
                  - id: t2Cd4
                    name: kvadratické rovnice
                    scope: global
                  chapters:
