components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the auth part (not in this spec yet).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Sqid'}
    Scope:
      name: scope
      in: query
      required: true
      description: mine = dashboard (own problems), public = public browser.
      schema: {type: string, enum: [mine, public]}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    TagIdFilter:
      name: tagId
      in: query
      schema:
        type: array
        items: {$ref: '#/components/schemas/Sqid'}
    ChapterIdFilter:
      name: chapterId
      in: query
      description: Includes problems from child chapters.
      schema:
        type: array
        items: {$ref: '#/components/schemas/Sqid'}
    LanguageFilter:
      name: language
      in: query
      schema: {type: string, example: cs}
    TagQuery:
      name: q
      in: query
      description: Text the tag name must contain (case-insensitive).
      schema: {type: string, minLength: 1, example: rovn}
    ChildId:
      name: childId
      in: path
      required: true
      description: A child of the set given by `id`.
      schema:
        $ref: '#/components/schemas/Sqid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The set's lockVersion in quotes, e.g. `"4"` (an ETag).
        DELETE has no body, so the optimistic lock travels in this header.
        Missing or malformed → 400; does not match → 412 LOCK_MISMATCH.
      schema:
        type: string
        example: '"4"'
    IdsFilter:
      name: ids
      in: query
      description: |
        Batch read: only these problems (`?ids=a&ids=b`). At most 100.
        Same visibility and scope rules as the rest of the list;
        set children are not returned (load the set instead).
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Sqid'
    UpdateAvailableFilter:
      name: updateAvailable
      in: query
      description: |
        Only with scope=mine. true = only your copies whose original has a newer version
        you have not taken over or dismissed. With limit=1, meta.total is the badge count.
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorDetails'}
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: VALIDATION_FAILED
            detail: name must not be empty.
    Unauthorized:
      description: Not logged in, or the login expired.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorDetails'}
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: UNAUTHENTICATED
            detail: You are not logged in.
    Forbidden:
      description: Logged in, but not allowed to do this.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorDetails'}
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: FORBIDDEN
            detail: You are not allowed to perform this action.
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorDetails'}
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: NOT_FOUND
            detail: The resource you are looking for was not found.
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorDetails'}
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: LOCK_MISMATCH
            detail: Someone saved this problem in between. Reload and try again.
    PreconditionFailed:
      description: The If-Match version does not match the current version (RFC 9110).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: LOCK_MISMATCH
            detail: Someone changed this set in between. Reload and try again.
  schemas:
    Sqid:
      type: string
      example: k3Xa9
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: {$ref: '#/components/schemas/Sqid'}
        displayName: {type: string}
    TagRef:
      type: object
      required: [id, name, scope]
      properties:
        id: {$ref: '#/components/schemas/Sqid'}
        name: {type: string}
        scope: {type: string, enum: [global, personal]}
    ChapterRef:
      type: object
      required: [id, name, scope]
      properties:
        id: {$ref: '#/components/schemas/Sqid'}
        name: {type: string}
        scope: {type: string, enum: [global, personal]}
    LicenseRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Sqid'}
        name: {type: string, example: CC BY 4.0}
        url: {type: string, nullable: true}
    SourceRef:
      type: object
      required: [type, license, licenseNote, showInWeb, showInPdf]
      properties:
        type:
          type: string
          enum: [OWN, LICENSED_USE, FREE_USE]
        license:
          description: The licence, or null when none is set yet (OWN before publishing).
          anyOf:
          - $ref: '#/components/schemas/LicenseRef'
          - type: object
            nullable: true
            enum:
            - null
        citation:
          type: string
          nullable: true
          description: >
            Null for OWN (frontend builds it from author).
            Omitted for viewers outside the source's citation audience
            (applies to anonymous share-code views).
        licenseNote: {type: string, nullable: true}
        showInWeb: {type: boolean}
        showInPdf: {type: boolean}
    ProblemBase:
      type: object
      properties:
        name: {type: string, minLength: 1}
        assignment: {type: string, minLength: 1}
        result: {type: string, nullable: true}
        language: {type: string, nullable: true, example: cs}
        difficulty: {type: integer, nullable: true, minimum: 1, maximum: 10}
    ProblemCreate:
      allOf:
      - $ref: '#/components/schemas/ProblemBase'
      - type: object
        required: [name, assignment]
        properties:
          name: {type: string, minLength: 1}
          assignment: {type: string, minLength: 1}
          tagIds:
            type: array
            items: {$ref: '#/components/schemas/Sqid'}
          chapterIds:
            type: array
            items: {$ref: '#/components/schemas/Sqid'}
    ProblemPatch:
      allOf:
      - $ref: '#/components/schemas/ProblemBase'
      - type: object
        required: [lockVersion]
        properties:
          lockVersion: {type: integer}
          tagIds:
            type: array
            description: Missing = unchanged. Sent = replaces the whole list.
            items: {$ref: '#/components/schemas/Sqid'}
          chapterIds:
            type: array
            description: Missing = unchanged. Sent = replaces the whole list.
            items: {$ref: '#/components/schemas/Sqid'}
    ProblemListItem:
      allOf:
      - $ref: '#/components/schemas/ProblemBase'
      - type: object
        required: [id, name, assignment, author, tags, chapters, childCount]
        properties:
          name: {type: string, minLength: 1}
          assignment: {type: string, minLength: 1}
          id: {$ref: '#/components/schemas/Sqid'}
          author: {$ref: '#/components/schemas/UserRef'}
          tags:
            type: array
            items: {$ref: '#/components/schemas/TagRef'}
          chapters:
            type: array
            items: {$ref: '#/components/schemas/ChapterRef'}
          childCount:
            type: integer
            minimum: 0
            description: 0 = standalone problem, more = set. Counted by the server, not stored.
          updateAvailable:
            type: boolean
            description: |
              Present only for the author of a copy (on a set: only on the set itself, never on its children).
              true = the original has a newer version than the one taken over, and it was not dismissed.
              Computed on read, not stored.
    ProblemDetailCore:
      description: Detail fields shared by a problem and by each child inside a set.
      allOf:
      - $ref: '#/components/schemas/ProblemListItem'
      - type: object
        required: [source]
        properties:
          createdAt: {type: string, format: date-time}
          updatedAt: {type: string, format: date-time}
          source: {$ref: '#/components/schemas/SourceRef'}
          lockVersion:
            type: integer
            description: |
              Present only for the author. Send back in PATCH /problems/{id}.
              For a set, also send it with the /children endpoints (structure changes).
              Each child has its own lockVersion for editing its content.
    ProblemDetail:
      allOf:
      - $ref: '#/components/schemas/ProblemDetailCore'
      - type: object
        required: [parentId, children]
        properties:
          status:
            type: string
            enum: [PRIVATE, REVIEWING, PUBLISHED, WITHDRAWN, BLOCKED]
            description: Present only for the author.
          version:
            type: integer
            description: Present only for the author. A change to any child also raises the set's version.
          parentId:
            type: string
            nullable: true
            example: k3Xa9
            description: Sqid of the set this problem belongs to, or null when it is not a set child.
          children:
            type: array
            description: Ordered children of a set. Empty for a standalone problem or a child.
            items: {$ref: '#/components/schemas/ProblemDetailCore'}
          originalId:
            type: string
            nullable: true
            example: VqXmZ
            description: Present only for the author. The problem this one was copied from (to look at a newer version before taking it over), or null.
    ChapterNode:
      allOf:
      - $ref: '#/components/schemas/ChapterRef'
      - type: object
        required: [parentId]
        properties:
          parentId:
            type: string
            nullable: true
            example: c9Kd1
            description: Sqid of the parent chapter, or null for a top-level chapter.
    ChapterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ChapterNode'}
    TagPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TagRef'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    License:
      allOf:
      - $ref: '#/components/schemas/LicenseRef'
      - type: object
        required: [requiresAttribution, allowsModification, requiresShareAlike]
        properties:
          description: {type: string, nullable: true}
          requiresAttribution: {type: boolean}
          allowsModification: {type: boolean}
          requiresShareAlike:
            type: boolean
            description: Copies inherit the licence.
    LicenseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/License'}
    PublishRequest:
      type: object
      properties:
        licenseId:
          allOf:
          - $ref: '#/components/schemas/Sqid'
          description: Required only when the problem has no licence yet. Must allow publication.
    AddChildRequest:
      type: object
      required:
      - lockVersion
      description: |
        Exactly one of `problemId` (move your own problem in) or `copyFromId` (copy any visible problem in).
        Both or neither → 400 VALIDATION_FAILED.
      properties:
        lockVersion:
          type: integer
          description: The set's lockVersion.
        problemId:
          allOf:
          - $ref: '#/components/schemas/Sqid'
          description: 'Move: your own PRIVATE standalone problem that is not a set. It becomes a child; no copy is made.'
        copyFromId:
          allOf:
          - $ref: '#/components/schemas/Sqid'
          description: 'Copy: any problem you can see that is not a set. The copy becomes the child (usual copy rules).'
        afterId:
          type: string
          nullable: true
          example: gbHJd
          description: |
            Where to put it. Missing = at the end. null = first. A child id = right after that child.
    ReorderChildRequest:
      type: object
      required:
      - lockVersion
      - afterId
      properties:
        lockVersion:
          type: integer
          description: The set's lockVersion.
        afterId:
          type: string
          nullable: true
          example: gbHJd
          description: Required. null = move to first. A child id = right after that child (to move last, use the current last child).
    TakeOverRequest:
      type: object
      required:
      - lockVersion
      properties:
        lockVersion:
          type: integer
          description: The copy's lockVersion (taking over overwrites your edits).
    ProblemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProblemListItem'}
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: {type: integer}
        limit: {type: integer}
        total: {type: integer}
    ProblemPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProblemListItem'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    ErrorDetails:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          example: LOCK_MISMATCH
          description: |
            Exact error case, so the frontend can show the right message.
            400 VALIDATION_FAILED - invalid input
            401 UNAUTHENTICATED - not logged in
            403 FORBIDDEN - logged in, but not allowed
            403 TRUST_TOO_LOW - registered user trying to publish
            404 NOT_FOUND - problem does not exist or is hidden
            409 LOCK_MISMATCH - lockVersion does not match
            412 LOCK_MISMATCH - If-Match version does not match (DELETE …/children/{childId})
            409 SET_PARENT_HAS_RESULT - a set (or a problem getting its first child) still has a result
            409 LICENSE_REQUIRED - publishing (or adding to a published set) without a licence that allows publication
            409 NOT_A_SET - dissolving something that is not a set
            409 SET_CHILD_NOT_PUBLISHABLE - publishing a child on its own
            409 IS_SET_CHILD - delete, dissolve or add-children sent to a set child (take it out of the set first)
            409 CANNOT_ADD_TO_SET - the problem cannot go into this set (already in a set, is a set, is the set itself,
                or for a move: not yours or not private); `detail` says which
            409 NO_UPDATE_AVAILABLE - take-over or dismiss when the copy has no update (or is not a copy)
        requestId: {type: string}
