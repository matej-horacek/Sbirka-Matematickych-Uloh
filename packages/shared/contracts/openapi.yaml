                    name: Rovnice
                    scope: global
                  childCount: 2
                - id: p5Qw8
                  name: Obsah kruhu
                  assignment: Vypočítejte obsah kruhu o poloměru \( r = 5\,\text{cm} \).
                  result: \( S = 25\pi\,\text{cm}^2 \)
                  language: cs
                  difficulty: 2
                  author:
                    id: u7Hn2
                    displayName: Jan Novák
                  tags:
                  - id: t5Gh6
                    name: geometrie
                    scope: global
                  chapters:
