    delete:
      summary: Soft delete a problem
      operationId: deleteProblem
      tags:
      - Problems
      description: |
        Who: the author only. Not allowed on a set child: take it out of the set first
        (DELETE /problems/{setId}/children/{childId}), then delete it.
        Soft delete (hidden). On a set, deletes the set together with its children.
        To keep the children, use POST /problems/{id}/dissolve instead.
        Codes: 403 FORBIDDEN; 404 NOT_FOUND; 409 IS_SET_CHILD.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
