    patch:
      summary: Update a problem
      operationId: updateProblem
      tags:
      - Problems
      description: |
        Who: the author only. Works on any problem, including a set child.
        Send the problem's own lockVersion. Editing a set child also raises the set's version
        (copy holders of the set see `updateAvailable`); it does not change the set's lockVersion.
        A non-author gets 403 on a published problem and 404 on a private one.
        - 200: the change is applied (private problem, or author is a trusted teacher/admin).
        - 202: the problem (or the set it belongs to) is published and the author is not trusted;
          the change is saved as a revision waiting for review, and the returned problem is unchanged.
        Codes: 400 VALIDATION_FAILED; 403 FORBIDDEN; 404 NOT_FOUND;
        409 LOCK_MISMATCH, SET_PARENT_HAS_RESULT (a result on a set).
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemPatch'
            examples:
