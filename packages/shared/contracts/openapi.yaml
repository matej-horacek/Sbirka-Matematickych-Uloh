    post:
      summary: Create a problem
      operationId: createProblem
      tags:
      - Problems
      description: |
        Who: any logged-in teacher (registered teachers too; creating is private).
        Creates one problem. The new problem is PRIVATE, owned by the caller, with source OWN
        and no licence (the licence is chosen when publishing).
        To build a set, create the problems, then add them with POST /problems/{id}/children.
        Codes: 400 VALIDATION_FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemCreate'
            examples:
              single:
                summary: One problem (a block)
                value:
                  name: Rovnice a)
                  assignment: \( 2x + 3 = 11 \)
                  result: \( x = 4 \)
                  language: cs
                  difficulty: 2
                  tagIds:
                  - t1Ab3
                  chapterIds:
                  - c4Lm7
      responses:
