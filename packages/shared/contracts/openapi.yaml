  /problems/{id}/copy:
    post:
      summary: Copy a problem
      operationId: copyProblem
      tags:
      - Problem actions
      description: |
        Who: any logged-in teacher who can see the problem (own problems, or published ones).
        No request body. Creates a new problem owned by the caller:
        - standalone problem → standalone copy
        - set → new set with copies of all its children
        - set child → standalone copy (the original set is not changed)
        The copy is PRIVATE and keeps a link to the original and its version
        (used for "update available" checks).
        Source: OWN → LICENSED_USE citing the original author, except when you copy your own problem
        (then it stays OWN, without a citation); LICENSED_USE and FREE_USE keep their type and citation;
        the licence is always inherited.
        Tags and chapters: only global ones are copied, unless the caller owns the original.
        Attachments point to the same stored images (no file is duplicated).
        Codes: 404 NOT_FOUND.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Copy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                id: q6Rs4
                name: Obsah kruhu
                assignment: Vypočítejte obsah kruhu o poloměru \( r = 5\,\text{cm} \).
                result: \( S = 25\pi\,\text{cm}^2 \)
                language: cs
                difficulty: 2
                author:
                  id: u3Kp8
                  displayName: Eva Svobodová
                tags:
                - id: t5Gh6
                  name: geometrie
                  scope: global
                chapters:
                - id: c2Xy5
                  name: Planimetrie
                  scope: global
                childCount: 0
                createdAt: '2026-10-25T14:02:00Z'
                updatedAt: '2026-10-25T14:02:00Z'
                source:
                  type: LICENSED_USE
                  license:
                    id: L2bY4
                    name: CC BY 4.0
                    url: https://creativecommons.org/licenses/by/4.0/
                  citation: 'Převzato od: Jan Novák'
                  licenseNote: null
                  showInWeb: true
                  showInPdf: true
