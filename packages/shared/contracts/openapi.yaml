openapi: 3.0.3
info:
  title: Math app endpoints
  description: |
    Documentation of endpoints for the math problem library
    (Komunitní sbírka úloh z matematiky).

    ## Changelog
    - 1.0.1 (2026-10-25): documentation only. operationId on every endpoint, grouping
      sections (Problems, Problem actions, Pickers), realistic request and response examples.
    - 1.0.0 (2026-10-25): frozen contract for the problem part. Problems CRUD with whole-set
      editing (`children`), copy, publish, dissolve; read-only pickers for tags, chapters
      and licences; RFC 9457 errors with `code` values; bearer (JWT) auth on all endpoints.
  version: 1.0.1

servers:
- url: https://main.server.com/api/v1
  description: Not implemented yet

security:
- bearerAuth: []

tags:
- name: Problems
  description: Create, read, update and delete problems and whole sets.
- name: Problem actions
  description: Copy, publish and dissolve.
- name: Pickers
  description: Read-only lists for the editor (tags, chapters, licences).
paths:
  /problems:
    get:
      summary: List problems
      operationId: listProblems
      tags:
      - Problems
      description: |
        Who: any logged-in teacher.
        scope=mine returns the caller's own problems (dashboard),
        scope=public returns published problems (public browser).
        Set children are not listed on their own; only standalone problems
        and set parents appear (see childCount).
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/TagIdFilter'
      - $ref: '#/components/parameters/ChapterIdFilter'
      - $ref: '#/components/parameters/LanguageFilter'
      responses:
        '200':
          description: Problems received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
              example:
                items:
                - id: k3Xa9
                  name: Řešte rovnice
                  assignment: 'Vyřešte rovnice v oboru reálných čísel:'
                  result:
                  language: cs
                  difficulty: 3
                  author: &id001
                    id: u7Hn2
                    displayName: Jan Novák
                  tags: &id007
                  - &id009
                    id: t1Ab3
                    name: lineární rovnice
                    scope: global
                  - &id012
                    id: t2Cd4
                    name: kvadratické rovnice
                    scope: global
                  chapters: &id008
                  - &id010
                    id: c9Kd1
                    name: Rovnice
                    scope: global
                  childCount: 2
                - id: p5Qw8
                  name: Obsah kruhu
                  assignment: Vypočítejte obsah kruhu o poloměru \( r = 5\,\text{cm} \).
                  result: \( S = 25\pi\,\text{cm}^2 \)
                  language: cs
                  difficulty: 2
                  author: *id001
                  tags: &id015
                  - id: t5Gh6
                    name: geometrie
                    scope: global
                  chapters: &id016
                  - id: c2Xy5
                    name: Planimetrie
                    scope: global
                  childCount: 0
                meta:
                  page: 1
                  limit: 20
                  total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a problem
      operationId: createProblem
      tags:
      - Problems
      description: |
        Who: any logged-in teacher (registered teachers too; creating is private).
        The new problem is PRIVATE, owned by the caller, with source OWN and no licence
        (the licence is chosen when publishing).
        Sending `children` creates a set; then `result` must be null.
        Codes: 400 VALIDATION_FAILED (includes a set parent with a result).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemCreate'
            examples:
              newSet:
                summary: A new set with two children
                value:
                  name: Řešte rovnice
                  assignment: 'Vyřešte rovnice v oboru reálných čísel:'
                  result:
                  language: cs
                  difficulty: 3
                  tagIds:
                  - t1Ab3
                  - t2Cd4
                  chapterIds:
                  - c9Kd1
                  children:
                  - name: Rovnice a)
                    assignment: \( 2x + 3 = 11 \)
                    result: \( x = 4 \)
                    difficulty: 2
                    tagIds:
                    - t1Ab3
                    chapterIds:
                    - c9Kd1
                  - name: Rovnice b)
                    assignment: \( x^2 = 9 \)
                    result: \( x = \pm 3 \)
                    difficulty: 3
                    tagIds:
                    - t2Cd4
                    chapterIds:
                    - c9Kd1
      responses:
        '201':
          description: Created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                id: k3Xa9
                name: Řešte rovnice
                assignment: 'Vyřešte rovnice v oboru reálných čísel:'
                result:
                language: cs
                difficulty: 3
                author: &id002
                  id: u7Hn2
                  displayName: Jan Novák
                tags:
                - &id003
                  id: t1Ab3
                  name: lineární rovnice
                  scope: global
                - &id006
                  id: t2Cd4
                  name: kvadratické rovnice
                  scope: global
                chapters:
                - &id004
                  id: c9Kd1
                  name: Rovnice
                  scope: global
                childCount: 2
                createdAt: '2026-10-25T14:02:00Z'
                updatedAt: '2026-10-25T14:02:00Z'
                source: &id005
                  type: OWN
                  license:
                  citation:
                  licenseNote:
                  showInWeb: true
                  showInPdf: true
                status: PRIVATE
                version: 1
                lockVersion: 1
                parentId:
                children:
                - id: a1B2c
                  name: Rovnice a)
                  assignment: \( 2x + 3 = 11 \)
                  result: \( x = 4 \)
                  language: cs
                  difficulty: 2
                  author: *id002
                  tags:
                  - *id003
                  chapters:
                  - *id004
                  childCount: 0
                  createdAt: '2026-10-25T14:02:00Z'
                  updatedAt: '2026-10-25T14:02:00Z'
                  source: *id005
                - id: d4E5f
                  name: Rovnice b)
                  assignment: \( x^2 = 9 \)
                  result: \( x = \pm 3 \)
                  language: cs
                  difficulty: 3
                  author: *id002
                  tags:
                  - *id006
                  chapters:
                  - *id004
                  childCount: 0
                  createdAt: '2026-10-25T14:02:00Z'
                  updatedAt: '2026-10-25T14:02:00Z'
                  source: *id005
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /problems/{id}:
