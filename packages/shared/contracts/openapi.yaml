  /problems/{id}/publish:
    post:
      summary: Publish a problem
      operationId: publishProblem
      tags:
      - Problem actions
      description: |
        Who: the author, if verified or trusted. Not allowed on a set child;
        publishing a set publishes the parent with all its children as one unit.
        - trusted teacher / admin → PUBLISHED
        - verified teacher → REVIEWING (waits for review)
        - registered (unverified) teacher → 403 TRUST_TOO_LOW
        The problem needs a licence that allows publication. If it has none yet,
        send `licenseId` in the body; if it already has one, `licenseId` is ignored
        (a licence cannot be changed once set).
        On a set, `licenseId` is applied to the parent and to every child without a licence;
        a child whose licence does not allow publication → 409 LICENSE_REQUIRED
        (the `detail` names the child).
        Already PUBLISHED or REVIEWING → 200 with no change. BLOCKED → 403 FORBIDDEN.
        Codes: 400 VALIDATION_FAILED; 403 FORBIDDEN, TRUST_TOO_LOW; 404 NOT_FOUND;
        409 LICENSE_REQUIRED, SET_CHILD_NOT_PUBLISHABLE.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
            examples:
              withLicense:
                summary: 'First publication: choose a licence'
                value:
                  licenseId: L2bY4
      responses:
        '200':
          description: Published, or sent to review (see `status`).
