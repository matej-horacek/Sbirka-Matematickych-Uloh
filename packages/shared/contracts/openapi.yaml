    delete:
      summary: Take a child out of its set
      operationId: removeSetChild
      tags:
      - Sets
      description: |
        Who: the set's author. The child is not deleted: it becomes a standalone PRIVATE problem again.
        (To delete it, call DELETE /problems/{childId} afterwards.) When the last child is taken out,
        the set is a plain problem again (childCount 0).
        The set's lockVersion goes in the If-Match header, because DELETE has no body.
        Returns 200 with the whole set instead of 204, so the editor gets the new lockVersion (RFC 9110 allows a body).
        Codes: 400 VALIDATION_FAILED (missing or malformed If-Match); 403 FORBIDDEN;
        404 NOT_FOUND (set, or childId not in this set); 412 LOCK_MISMATCH.
      parameters:
      - $ref: '#/components/parameters/Id'
