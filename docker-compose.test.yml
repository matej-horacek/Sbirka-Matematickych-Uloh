# Throwaway Postgres for `pnpm test:prisma` (port 5433, so it never touches the dev database on 5432).
# Data lives in tmpfs: it is gone when the container stops.
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sbirka_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sbirka_test"]
      interval: 1s
      timeout: 3s
      retries: 30
